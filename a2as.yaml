manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: michelzandonai/jira-mcp
    source: https://github.com/michelzandonai/jira-mcp
    branch: main
    commit: "3b09e823"
    scope: [main.py, src/__init__.py, src/agents/agent.py, src/agents/guardrails.py, src/config.py, src/issue_creator.py,
      src/project_explorer.py, src/tools/batch_create_issues.py, src/tools/batch_log_work.py, src/tools/create_issue.py, src/tools/get_issue_types.py,
      src/tools/get_project_details.py, src/tools/log_work_on_issue.py, src/tools/search_issues_by_summary.py, src/tools/search_jira_projects.py,
      src/tools/update_issue_estimates.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T17:02:50Z'
    url: https://a2as.org/certified/agents/michelzandonai/jira-mcp
  signatures:
    digest: sha256:yYHG97fEH7ucCZjREHoP86quuPyLBk61z36403xVBTs
    key: ed25519:LI1MCwrihkUeGtMIkfANgXGvKKugYJQeBe_WenBiJY8
    sig: ed25519:ozdpM4kTSEX5ifRSsgsP737JWhKeC-Wp087GTi_YWlex5mA4hlo_2vF01d1eodh0UaiKCbkTfQELeTcRFqVYAA

agents:
  root_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [batch_log_work, batch_create_issues, log_work_on_issue, create_issue, update_issue_estimates, search_jira_projects,
      get_project_details, search_issues_by_summary, get_issue_types]
    params:
      name: JiraAgent
      description: Agente para interagir com o Jira. Permite explorar projetos, criar issues e registrar horas.
      before_tool_callback: before_tool_callback_handler
      instruction: [Sua função é ser um assistente Jira. Analise o pedido do usuário e priorize o uso de ferramentas em LOTE
          sempre que possível., '- Para registrar horas em MÚLTIPLAS tarefas de um projeto, use `batch_log_work`.', '- Para
          CRIAR MÚLTIPLAS issues de uma vez (com ou sem registro de horas), use `batch_create_issues`.', '- Para ações em
          UMA ÚNICA tarefa, use as ferramentas individuais (`log_work_on_issue`, `create_issue`, etc.).', '- Para buscar informações,
          use as ferramentas de busca.']

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent]

tools:
  batch_create_issues:
    type: function
    agents: [root_agent]
  batch_log_work:
    type: function
    agents: [root_agent]
  create_issue:
    type: function
    agents: [root_agent]
  get_issue_types:
    type: function
    agents: [root_agent]
  get_project_details:
    type: function
    agents: [root_agent]
  log_work_on_issue:
    type: function
    agents: [root_agent]
  search_issues_by_summary:
    type: function
    agents: [root_agent]
  search_jira_projects:
    type: function
    agents: [root_agent]
  update_issue_estimates:
    type: function
    agents: [root_agent]

imports:
  agent: agents.agent
  Any: typing.Any
  asyncio: asyncio
  BaseModel: pydantic.BaseModel
  BaseTool: google.adk.tools.base_tool.BaseTool
  batch_create_issues: src.tools.batch_create_issues.batch_create_issues
  batch_log_work: src.tools.batch_log_work.batch_log_work
  before_tool_callback_handler: src.agents.guardrails.before_tool_callback_handler
  config: src.config
  create_issue: src.tools.create_issue.create_issue
  dateparser: dateparser
  datetime: datetime.datetime
  Dict: typing.Dict
  FastAPI: fastapi.FastAPI
  Field: pydantic.Field
  FunctionTool: google.adk.tools.FunctionTool
  genai_types: google.genai.types
  get_issue_types: src.tools.get_issue_types.get_issue_types
  get_project_details: src.tools.get_project_details.get_project_details
  InMemoryRunner: google.adk.runners.InMemoryRunner
  issue_creator_agent: agents.issue_creator_agent.issue_creator_agent
  JIRA: jira.JIRA
  JIRAError: jira.JIRAError
  List: typing.List
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  log_work_on_issue: src.tools.log_work_on_issue.log_work_on_issue
  logging: logging
  Optional: typing.Optional
  os: os
  project_explorer_agent: agents.project_explorer_agent.project_explorer_agent
  re: re
  root_agent: src.agents.agent.root_agent
  search_issues_by_summary: src.tools.search_issues_by_summary.search_issues_by_summary
  search_jira_projects: src.tools.search_jira_projects.search_jira_projects
  ToolContext: google.adk.tools.tool_context.ToolContext
  update_issue_estimates: src.tools.update_issue_estimates.update_issue_estimates
  utils: src.utils
  uuid: uuid
  uvicorn: uvicorn

functions:
  batch_create_issues_func:
    type: sync
    module: src.tools.batch_create_issues
    args: [tool_input]
    params:
      returns: str
  batch_log_work_func:
    type: sync
    module: src.tools.batch_log_work
    args: [tool_input]
    params:
      returns: str
  before_tool_callback_handler:
    type: sync
    module: src.agents.guardrails
    args: [tool, args, tool_context]
    params:
      returns: Optional[Dict]
  converse:
    type: async
    module: main
    args: [request]
  create_issue_func:
    type: sync
    module: src.tools.create_issue
    args: [tool_input]
    params:
      returns: str
  find_issue_by_summary:
    type: sync
    module: src.utils
    args: [jira_client, project_key, summary, find_one]
    params:
      returns: tuple
  find_project_by_identifier:
    type: sync
    module: src.utils
    args: [jira_client, identifier]
    params:
      returns: tuple
  get_issue_types_func:
    type: sync
    module: src.tools.get_issue_types
    args: [tool_input]
    params:
      returns: str
  get_jira_client:
    type: sync
    module: src.utils
  get_project_details_func:
    type: sync
    module: src.tools.get_project_details
    args: [tool_input]
    params:
      returns: str
  get_user_account_id_by_email:
    type: sync
    module: src.utils
    args: [jira_client, email]
    params:
      returns: tuple
  is_valid_date:
    type: sync
    module: src.utils
    args: [date_string, format]
    params:
      returns: bool
  log_work_for_issue:
    type: sync
    module: src.utils
    args: [jira_client, issue_key, time_spent, work_start_date, work_description]
    params:
      returns: tuple
  log_work_on_issue_func:
    type: sync
    module: src.tools.log_work_on_issue
    args: [tool_input]
    params:
      returns: str
  resolve_issue_identifier:
    type: sync
    module: src.utils
    args: [jira_client, project_key, issue_identifier]
    params:
      returns: tuple
  root:
    type: async
    module: main
  search_issues_by_summary_func:
    type: sync
    module: src.tools.search_issues_by_summary
    args: [tool_input]
    params:
      returns: str
  search_jira_projects_func:
    type: sync
    module: src.tools.search_jira_projects
    args: [tool_input]
    params:
      returns: str
  update_issue_estimates_func:
    type: sync
    module: src.tools.update_issue_estimates
    args: [tool_input]
    params:
      returns: str
  validate_project_access:
    type: sync
    module: src.utils
    args: [jira_client, project_identifier]
    params:
      returns: tuple

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [src.config]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.getenv]
      path: [src.config]
  GOOGLE_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [src.config]
  JIRA_API_TOKEN:
    type: env
    params:
      caller: [os.getenv]
      path: [src.config]
  JIRA_SERVER_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [src.config]
  JIRA_USERNAME:
    type: env
    params:
      caller: [os.getenv]
      path: [src.config]
